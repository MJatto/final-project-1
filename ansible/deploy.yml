- name: Provision EC2 Chat App Server
  hosts: chat
  become: true

  tasks:
    - name: Install Node.js and Git
      shell: |
        curl -fsSL https://rpm.nodesource.com/setup_18.x | bash -
        yum install -y nodejs git

    - name: Install PM2 globally
      become: true
      shell: npm install -g pm2

    - name: Install and configure Nginx
      yum:
        name: nginx
        state: present

    - name: Add Nginx reverse proxy config
      copy:
        dest: /etc/nginx/conf.d/chat.conf
        content: |
          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://localhost:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
              }
          }

    - name: Start and enable Nginx
      systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Create chat app directory
      file:
        path: /home/ec2-user/chat-app
        state: directory
        owner: ec2-user
        group: ec2-user

